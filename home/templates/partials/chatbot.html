<!-- 聊天入口按钮 -->
<div class="chatbot__toggle" id="chatbot-toggle">
    🤖
</div>

<!-- 聊天框 -->
<div class="chatbot chatbot--hidden" id="chatbot-container">
    <div class="chatbot__header">
        <span class="chatbot__title">AI 助手</span>
        <button class="chatbot__close" id="chatbot-close">×</button>
    </div>
    <div class="chatbot__body" id="chat-body">
        <div class="chatbot__message chatbot__message--bot">你好，我是你的网站助理~</div>
    </div>
    <div class="chatbot__input">
        <input type="text" class="chatbot__input-field" id="chat-input" placeholder="输入你的问题..." />
        <button class="chatbot__send-btn" id="chat-send">发送</button>
    </div>
</div>
